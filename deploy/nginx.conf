worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js `output: export` 生成的是扁平 HTML（posts.html、posts/2024/freedom.html），
    # 没有 posts/index.html。若直接用默认配置，nginx 会把 /posts 301 到 /posts/，
    # 而该目录下没有 index 文件，于是返回 403。
    #
    # 这里的顺序很关键：
    #   $uri          -> 命中真实文件（含 .txt/.xml/图片等）
    #   $uri.html     -> 把 /posts 映射到 posts.html（站点的主链接形式）
    #   $uri/index.html -> 兼容带尾斜杠的访问
    #   =404          -> 其余返回真正的 404，避免软 404 影响 SEO
    location / {
      try_files $uri $uri.html $uri/index.html =404;
    }

    # Next.js 静态资源带内容哈希，可长期强缓存
    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # 文本资源启用压缩（图片/视频本身已压缩，无需重复处理）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;
  }
}
