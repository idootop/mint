name: 'Build and Deploy'

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 初始化 PNPM / Node 并安装依赖
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
      - name: 初始化 Next.js 缓存
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mdx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: 构建网站
        run: pnpm build
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: out
          retention-days: 3

  # 三个部署目标相互独立、并行执行：任一目标失败，其它目标仍继续。
  deploy-cos:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - name: 缓存 coscli
        uses: actions/cache@v6
        with:
          # scripts/deploy/cos.sh 把 coscli 装到 $HOME/.local/bin（可缓存目录）
          path: ~/.local/bin
          # key 带版本号：版本不变直接命中，版本升级自动失效并重新下载
          key: coscli-${{ runner.os }}-${{ runner.arch }}-${{ vars.COSCLI_VERSION || '1.0.9' }}
      - name: 部署到腾讯云 COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: bash scripts/deploy/cos.sh
      - name: 触发 Webhook 部署
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SITE_DIR: ${{ vars.WEBHOOK_SITE_DIR }}
          WEBHOOK_DOWNLOAD_URL: ${{ vars.WEBHOOK_DOWNLOAD_URL }}
        run: bash scripts/deploy/webhook.sh

  deploy-dokploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - name: 部署到 Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: bash scripts/deploy/dokploy.sh

