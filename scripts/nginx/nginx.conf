worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # ── 缓存策略 ──────────────────────────────────────────────────────────
  # 按"响应内容会不会变"划分，与 scripts/deploy/cos.sh 保持一致：
  #
  #   带内容哈希的资源（chunks、media、compressions）  文件名随内容变 → 365 天 immutable
  #   HTML / RSC 载荷 / sitemap / robots               内容会变       → no-cache
  #   其余（favicon、cover、logo 等少量无哈希文件）     同名可能被替换 → 一天
  #
  # 后两类交给 map，而不是散在一堆 location 正则里。
  # 注意：/posts 这类无扩展名的页面最终会内部重定向到 /posts.html，
  # $uri 随之变成 .html，所以不需要额外规则去识别它们。
  map $uri $static_cache {
    # 默认：普通静态文件缓存一天（favicon、cover、logo 等）
    default "public, max-age=86400";
    # 页面与文本：每次回源校验
    "~\.(html|txt|xml)$" "no-cache";
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的资源：文件名随内容变化，新版本是全新 URL，
    # 所以缓存久一点也不会读到旧内容。
    location ~ ^/(_next/static/(chunks|media)|compressions)/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # _next/static 下其余内容（buildId 目录里的 _buildManifest.js 等）
    # 文件名固定、内容随构建变化，不能缓存。用排除法而非枚举文件名，
    # Next 以后新增别的文件也能自动照顾到。
    location ~ ^/_next/static/ {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    # 带尾斜杠的页面：/posts/ → posts.html。
    # 这类目录里只有 RSC 文件（__next._full.txt 等），没有 index.html，
    # 直接 try_files 会命中目录而返回 404。这里先把结尾的 "/" 摘掉再找页面，
    # 用内部重定向完成，不会产生 301。
    location ~ ^(?<page>/.+)/$ {
      try_files $page.html $page $page/index.html =404;
      add_header Cache-Control "no-cache";
    }

    # 其余请求。Next.js `output: export` 生成的是扁平 HTML
    # （posts.html、posts/2024/freedom.html），没有 posts/index.html，
    # 所以这里把 /posts 映射到 posts.html、/x 映射到 x.html。
    location / {
      try_files $uri $uri.html $uri/index.html =404;
      add_header Cache-Control $static_cache;
    }

    # 文本资源启用压缩（图片/视频本身已压缩，无需重复处理）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;
  }
}
